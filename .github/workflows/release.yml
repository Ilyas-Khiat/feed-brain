name: release

# Push a tag like v1.2.0 to publish a release: the full test matrix runs first, then the tag is
# checked against the versions in the code, and the release is created with the CHANGELOG's notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the server's and the extension's version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          server=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' server/brain_server.py)
          extension=$(node -p "require('./extension/manifest.json').version")
          echo "tag $tag, server $server, extension $extension"
          if [ "$tag" != "$server" ] || [ "$tag" != "$extension" ]; then
            echo "::error::Tag v$tag doesn't match server $server / extension $extension"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          # Plain text matching (index), not a regex: "[1.0.0]" would be read as a character class.
          awk -v head="## [$v]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $v"; exit 1; fi
          cat notes.md
      - name: Build the download
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          git archive --format=zip --prefix="feed-brain-$v/" -o "feed-brain-$v.zip" HEAD
          sha256sum "feed-brain-$v.zip" > "feed-brain-$v.zip.sha256"
          unzip -l "feed-brain-$v.zip" | tail -1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "feed-brain-$v.zip" "feed-brain-$v.zip.sha256" \
            --title "Feed Brain $v" --notes-file notes.md --verify-tag
