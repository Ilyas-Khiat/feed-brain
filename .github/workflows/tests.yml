name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install
        run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: Run the tests
        run: python -m pytest

  javascript:
    name: node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        shell: bash
        run: |
          status=0
          for f in extension/*.js server/web/*.js; do
            node --check "$f" || { echo "::error file=$f::does not parse"; status=1; }
          done
          exit $status
