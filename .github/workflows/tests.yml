name: tests

on:
  push:
  pull_request:
  workflow_call:  # the release workflow runs these first

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install
        run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: Run the tests
        run: python -m pytest

  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the server with start.sh / start.cmd, like a new user
        run: python .github/scripts/launcher_smoke.py

  javascript:
    name: node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        shell: bash
        run: |
          status=0
          for f in extension/*.js server/web/*.js tools/screenshots/*.mjs; do
            node --check "$f" || { echo "::error file=$f::does not parse"; status=1; }
          done
          exit $status
      - name: Check the extension manifest's version matches the server's
        shell: bash
        run: |
          server=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' server/brain_server.py)
          extension=$(node -p "require('./extension/manifest.json').version")
          echo "server $server, extension $extension"
          test "$server" = "$extension"
